name: Daily Commit

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Make daily commit
        run: |
          git config user.name "cryptofino"
          git config user.email "cryptofino070@gmail.com"
          echo "$(date)" >> daily-log.txt
          git add daily-log.txt
          git commit -m "auto daily commit" || echo "No changes"
          git push
